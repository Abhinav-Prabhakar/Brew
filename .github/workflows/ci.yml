name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # after the explicit sync below, `uv run` must not "repair" the CPU torch back to the locked CUDA build
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      # pyproject.toml routes Linux torch to the CUDA 12.6 index (the training desktop). A CI runner has no GPU and the
      # CUDA wheels + nvidia-* libraries are several GB, so: sync everything from the lockfile EXCEPT torch, triton and the
      # nvidia-* runtime packages, then install the CPU wheel of the same torch version from the PyTorch CPU index.
      # (Nothing in pyproject.toml / uv.lock changes: the desktop training setup keeps using CUDA.)
      - name: Install dependencies (CPU torch)
        run: |
          skip="--no-install-package torch --no-install-package triton"
          for p in $(grep -oP '^name = "\Knvidia-[a-z0-9-]+' uv.lock); do skip="$skip --no-install-package $p"; done
          uv sync --frozen $skip
          torch_version=$(grep -A1 '^name = "torch"' uv.lock | grep -oP 'version = "\K[0-9.]+' | head -1)
          uv pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch==${torch_version}"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Types (mypy)
        run: uv run mypy src

      - name: Backend tests
        run: uv run pytest -q -m "not slow and not frontend"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Frontend - golden streams, store, sources, rendering, no-mock, perf (headless Chromium)
        run: uv run pytest -q -m "frontend and not integration and not visual and not slow"

      - name: Frontend - end to end (the real page served by brew-api)
        run: uv run pytest -q -m "frontend and integration"

      # Screenshots of the rooms vs tests/visual/<platform>-*.png. The page loads Google Fonts: if they cannot be
      # reached the tests SKIP (never flake); a platform without baselines (CI is linux, the committed ones are darwin)
      # checks that every scene renders deterministically and skips. `--update-visual` creates baselines.
      - name: Frontend - visual regression
        run: uv run pytest -q -m visual -rs

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/_diff/
          if-no-files-found: ignore

      - name: design/contract.json is up to date
        run: uv run python scripts/build_contract.py --check
