# Recipes: BOM + step DAG. duration: [mean_s, sd_s] (lognormal). attention in (0,1].
# depends_on: absent => previous step in the list; [] => no dependency (runs in parallel).
# packaging: groups applied per-recipe via `pack`; `when` = dine_in | carry (takeaway + delivery).
packaging:
  hot_drink:
    - {ingredient: cup_ceramic_m, qty: 1, returnable: true, when: dine_in}
    - {ingredient: cup_paper_m, qty: 1, when: carry}
    - {ingredient: lid, qty: 1, when: carry}
    - {ingredient: sleeve, qty: 1, when: carry}
  cold_drink:
    - {ingredient: cup_ceramic_m, qty: 1, returnable: true, when: dine_in}
    - {ingredient: cup_paper_m, qty: 1, when: carry}
    - {ingredient: lid, qty: 1, when: carry}
    - {ingredient: straw, qty: 1, when: carry}
  food:
    - {ingredient: plate, qty: 1, returnable: true, when: dine_in}
    - {ingredient: food_box, qty: 1, when: carry}
    - {ingredient: cutlery_set, qty: 1, when: carry}
recipes:
  espresso:
    pack: hot_drink
    components: [{ingredient: coffee_beans, qty: 18}]
    steps:
      - {name: grind, station: grinder, duration: [12, 3], attention: 1.0}
      - {name: shot, station: espresso, duration: [28, 4], attention: 0.3, uses_slot: true}
      - {name: hand, station: pass, duration: [8, 2], attention: 1.0}
  cappuccino:
    pack: hot_drink
    components: [{ingredient: coffee_beans, qty: 18}, {ingredient: milk, qty: 150}]
    steps: &milk_espresso
      - {name: grind, station: grinder, duration: [12, 3], attention: 1.0}
      - {name: shot, station: espresso, duration: [28, 4], attention: 0.3, uses_slot: true}
      - {name: steam, station: espresso, duration: [35, 6], attention: 0.6, batchable: true, max_batch: 3, batch_factor: 0.35, depends_on: []}
      - {name: pour, station: espresso, duration: [12, 3], attention: 1.0, depends_on: [shot, steam]}
      - {name: hand, station: pass, duration: [8, 2], attention: 1.0}
  flatwhite:
    pack: hot_drink
    components: [{ingredient: coffee_beans, qty: 18}, {ingredient: milk, qty: 120}]
    steps: *milk_espresso
  latte:
    pack: hot_drink
    components: [{ingredient: coffee_beans, qty: 18}, {ingredient: milk, qty: 200}]
    steps: *milk_espresso
  roselatte:
    pack: hot_drink
    components: [{ingredient: coffee_beans, qty: 18}, {ingredient: milk, qty: 200}, {ingredient: rose_syrup, qty: 15}]
    steps:
      - {name: grind, station: grinder, duration: [12, 3], attention: 1.0}
      - {name: shot, station: espresso, duration: [28, 4], attention: 0.3, uses_slot: true}
      - {name: steam, station: espresso, duration: [35, 6], attention: 0.6, batchable: true, max_batch: 3, batch_factor: 0.35, depends_on: []}
      - {name: syrup, station: espresso, duration: [6, 1], attention: 1.0, depends_on: []}
      - {name: pour, station: espresso, duration: [12, 3], attention: 1.0, depends_on: [shot, steam, syrup]}
      - {name: hand, station: pass, duration: [8, 2], attention: 1.0}
  icedlatte:
    pack: cold_drink
    components: [{ingredient: coffee_beans, qty: 18}, {ingredient: milk, qty: 150}, {ingredient: ice, qty: 150}]
    steps:
      - {name: grind, station: grinder, duration: [12, 3], attention: 1.0}
      - {name: shot, station: espresso, duration: [28, 4], attention: 0.3, uses_slot: true}
      - {name: build, station: cold, duration: [20, 4], attention: 1.0}
      - {name: hand, station: pass, duration: [8, 2], attention: 1.0}
  coldbrew:
    pack: cold_drink
    components: [{ingredient: coldbrew_concentrate, qty: 120}, {ingredient: ice, qty: 100}]
    steps:
      - {name: pour, station: cold, duration: [20, 4], attention: 1.0}
      - {name: hand, station: pass, duration: [8, 2], attention: 1.0}
  filtercoffee:
