# Smoke configuration: every stage (M2 + M3) end to end on an 8 GB Apple-silicon laptop (< 20 min).
name: smoke
runs_dir: data/runs/smoke
models_dir: models
device: auto                   # CUDA when available, else CPU
history:
  scenario: weekday_normal
  runs:                       # exploration worlds: random price levels, make-ahead batches, markdown ladders
    - {policy: B, seed: 101, days: 28}
    - {policy: B, seed: 102, days: 21}
    - {policy: A, seed: 103, days: 7}
  price_explore_prob: 0.8
  premake_explore: true
  ladder_explore: true
  price_experiment: {groups: 20, variants: 4, seed: 500, policy: B}   # CRN price experiment for elasticity
forecast: {n_estimators: 120, folds: 3, test_days: 2, min_history: 7}
elasticity: {alpha: 1.0e-6, shrink_k: 200}
prep_time: {n_estimators: 80}
rider_eta: {n_estimators: 80}
replate_model: {n_estimators: 60}
text: {source: clean, test_size: 0.25, seed: 0}
eval:                          # M2 acceptance protocol (C vs A/B, Replate on/off)
  policies: [A, B, C]
  seeds: [1, 2, 3]
  days: 3
  scenario: weekday_normal
  replate_ab: false
  workers: 2
bc:                            # behaviour cloning of Policy C
  days: 5
  episode_days: 5
  epochs: 60
  workers: 1
ppo:                           # MaskablePPO, 20k steps, 1-day episodes
  total_timesteps: 20000
  n_envs: 4
  vec: dummy
  n_steps: 128
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  lr_start: 1.0e-4            # conservative: the policy starts from the BC weights
  lr_end: 1.0e-4
  n_epochs: 4
  target_kl: 0.03
  critic_warmup_updates: 4    # value head only, right after BC
  ent_coef: 0.01
  clip_range: 0.2
  net_arch: [256, 256]
  curriculum:
    - {days: 1, frac: 1.0, shaping: 1.0}
  eval: {every: 5000, seeds: 5, days: 1, scenario: weekday_normal, base_seed: 1000, workers: 1}
  checkpoint_every: 10000
adversarial:                   # RARL: 5k adversary steps in k=2 iterations
  total_timesteps: 5000
  iterations: 2
  protagonist_steps: 1024
  n_envs: 2
  days: 1
export: {parity_obs: 256, parity_tol: 1.0e-4, surrogate_depth: 4, surrogate_days: 2, surrogate_seeds: 2}
final_eval:                    # arena after export: A, B, C and the learned D
  policies: [A, B, C, D]
  seeds: [1, 2, 3]
  days: [1, 3]
  scenario: weekday_normal
  workers: 2
