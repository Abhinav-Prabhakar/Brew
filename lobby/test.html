<!doctype html><html><head><meta charset="utf-8"><title>test</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f6d3dc}#stage{position:fixed;inset:0}#anchors{position:fixed;inset:0;pointer-events:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.35.3/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.8.1/dist/N8AO.js" } }</script>
</head><body><div id="stage"></div><div id="anchors"></div><div id="hud"></div>
<script type="module" src="js/boot.js"></script>
<script type="module" src="js/art.js"></script>
<script type="module" src="js/audio.js"></script>
<script type="module" src="js/core.js"></script>
<script type="module" src="js/gfx.js"></script>
<script type="module" src="js/food.js"></script>
<script type="module" src="js/world.js"></script>
<script type="module" src="js/people.js"></script>
<script type="module">
const B = window.B, G = B.gfx;
await document.fonts.ready;
B.world.redrawText();
G.start();
const ps = [];
[['commuter',1.6,1.9],['student',-0.5,1.3],['leisurely',-3.2,-0.5],['camper',0.6,-2.8],['student',4.6,-3.8]].forEach(([per,x,z],i)=>{
  const p = B.people.build(B.people.randomTraits(per)); p.root.position.set(x,0,z); G.scene.add(p.root); ps.push(p);
  B.people.setMood(p, i%2?'happy':'neutral'); if(i==0){B.people.ring(p,true,0.6,'#f2a93b');}
});
window.ps = ps;
const f = B.food.model('cappuccino'); f.position.set(1.0, 1.03, 2.7); f.scale.setScalar(1); G.scene.add(f);
window.testReady = true;
</script>
</body></html>
