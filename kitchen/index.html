<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>brew · Night Kitchen</title>
<meta name="description" content="brew — a first-person night kitchen. Cook, plate and serve from the line.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hud.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div id="hud" aria-live="polite">
  <!-- top-left: clock & service phase -->
  <section class="card clock" id="clock">
    <div class="clock-icon" id="clock-icon"></div>
    <div class="clock-text">
      <div class="clock-line"><span id="clock-day">Day 3</span><i class="dot"></i><span id="clock-time" class="tnum">8:42 PM</span></div>
      <div class="phase" id="clock-phase">Dinner Rush</div>
    </div>
    <div class="phase-bar"><svg viewBox="0 0 12 14" class="flame"><path d="M6 0c.6 2.6 4.4 4.2 4.4 8.1A4.4 4.4 0 0 1 6 12.6 4.4 4.4 0 0 1 1.6 8.1C1.6 6.3 2.7 5 3.5 4c.1 1.3.7 2.2 1.6 2.6C4.7 4.4 5.2 2 6 0Z"/></svg><div class="track"><div class="fill" id="phase-fill"></div></div></div>
  </section>

  <!-- top-centre: the rail -->
  <section class="tickets" id="tickets" aria-label="Order tickets"></section>

  <!-- top-right: money, stats, objective -->
  <div class="tr">
    <div class="tr-row">
      <section class="card wallet" id="wallet"><span class="coin">₹</span><span id="cash" class="tnum">4,280</span></section>
      <button class="card icon-btn" id="stats-btn" aria-label="Service stats" title="Service stats (S)"><svg viewBox="0 0 20 20"><rect x="3" y="10" width="3.2" height="7" rx="1"/><rect x="8.4" y="4" width="3.2" height="13" rx="1"/><rect x="13.8" y="7.5" width="3.2" height="9.5" rx="1"/></svg></button>
    </div>
    <section class="card objective" id="objective">
      <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" class="ring-bg"/><circle cx="18" cy="18" r="14" class="ring-fg" id="obj-ring"/></svg>
      <div><div class="obj-title" id="obj-title">Keep 3+ orders ahead</div><div class="obj-sub" id="obj-sub">Current: 2 ahead</div></div>
    </section>
    <section class="card stats" id="stats" hidden>
      <div class="stats-h">Tonight</div>
      <dl>
        <div><dt>Revenue</dt><dd id="st-rev" class="tnum">₹0</dd></div>
        <div><dt>Covers served</dt><dd id="st-served" class="tnum">0</dd></div>
        <div><dt>Avg ticket time</dt><dd id="st-tt" class="tnum">—</dd></div>
        <div><dt>Rating</dt><dd id="st-rating" class="tnum">4.6</dd></div>
        <div><dt>Kitchen load</dt><dd id="st-load" class="tnum">0%</dd></div>
        <div><dt>Replate rescued</dt><dd id="st-replate" class="tnum">0</dd></div>
      </dl>
    </section>
  </div>

  <!-- bottom-left: ingredients + current task -->
  <div class="bl">
    <div class="hotbar" id="hotbar"></div>
    <section class="card task" id="task">
      <div class="task-row"><span id="task-name">Steak</span><span id="task-step" class="tnum">2/3</span><span class="task-count tnum" id="task-count">2/3</span></div>
      <div class="track"><div class="fill" id="task-fill"></div></div>
    </section>
  </div>

  <!-- bottom-centre: stations & camera modes -->
  <nav class="stations" id="stations" aria-label="Stations"></nav>
  <div class="hint" id="hint"></div>
  <div class="toasts" id="toasts"></div>
</div>

<div id="loading">
  <div class="load-inner">
    <div class="brand">brew<span>night kitchen</span></div>
    <div class="track"><div class="fill" id="load-fill"></div></div>
    <div class="load-msg" id="load-msg">Lighting the pilot…</div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
