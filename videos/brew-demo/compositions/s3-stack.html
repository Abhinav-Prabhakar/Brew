<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s3-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s3-type {
          position: absolute;
          left: 120px;
          top: 170px;
          width: 1700px;
          height: 640px;
          transform-origin: 0 0;
        }
        #s3-a {
          left: 10px;
          top: 0;
          font-size: 100px;
          white-space: nowrap;
        }
        #s3-b {
          position: absolute;
          left: 10px;
          top: 130px;
          font-family: var(--body);
          font-size: 84px;
          line-height: 1;
          white-space: nowrap;
        }
        #s3-c {
          position: absolute;
          left: 0;
          top: 240px;
          font-family: var(--hand);
          font-size: 270px;
          line-height: 1;
          color: var(--terra-ink);
          white-space: nowrap;
          transform-origin: 30% 60%;
        }
        #s3-under {
          position: absolute;
          left: 0;
          top: 500px;
          width: 1500px;
          height: 60px;
        }
        #s3-lead {
          left: 130px;
          top: 560px;
          width: 700px;
          font-size: 96px;
        }
        #s3-arrow {
          position: absolute;
          left: 420px;
          top: 690px;
          width: 440px;
          height: 200px;
        }
        .s3-layer {
          left: 950px;
          width: 880px;
          height: 100px;
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 0 26px 0 18px;
          border-radius: 18px;
          box-shadow: 8px 8px 0 var(--ink);
        }
        .s3-layer i {
          flex: none;
          width: 62px;
          height: 62px;
          border-radius: 50%;
          border: 4px solid var(--ink);
          background: var(--paper);
          font-family: var(--mono);
          font-style: normal;
          font-weight: 700;
          font-size: 34px;
          line-height: 54px;
          text-align: center;
        }
        .s3-layer b {
          font-family: var(--hand);
          font-weight: 400;
          font-size: 44px;
          white-space: nowrap;
        }
        .s3-layer span {
          margin-left: auto;
          font-family: var(--body);
          font-size: 31px;
          white-space: nowrap;
        }
      </style>
      <div id="s3-root" data-composition-id="s3-stack" data-width="1920" data-height="1080">
        <div id="s3-type">
          <div id="s3-a" class="note">a cosy little café…</div>
          <div id="s3-b">that happens to be</div>
          <div id="s3-c">an ML system.</div>
          <svg id="s3-under" viewBox="0 0 1500 60" fill="none">
            <path id="s3-underp" d="M10 30 Q 380 4 760 28 T 1490 22" stroke="#1d1a1c" stroke-width="12" stroke-linecap="round" />
          </svg>
        </div>
        <div id="s3-lead" class="note">under the ink:</div>
        <svg id="s3-arrow" viewBox="0 0 440 200" fill="none" stroke="#1d1a1c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path id="s3-arrowp" d="M10 20 Q 190 190 420 110" />
          <path id="s3-arrowh" d="M372 70 L 424 110 L 366 148" />
        </svg>
        <div class="card s3-layer" style="top: 870px; background: #c9a27a"><i>1</i><b>digital twin</b><span>discrete-event café · CRN seeds</span></div>
        <div class="card s3-layer" style="top: 754px; background: #e3b25a"><i>2</i><b>forecasts</b><span>LightGBM quantile demand</span></div>
        <div class="card s3-layer" style="top: 638px; background: #8fa585"><i>3</i><b>operations research</b><span>CP-SAT · newsvendor</span></div>
        <div class="card s3-layer" id="s3-rl" style="top: 522px; background: #e07e52"><i>4</i><b>the RL manager</b><span>MaskablePPO → ONNX</span></div>
        <div class="card s3-layer" style="top: 406px; background: #f7c3a3"><i>5</i><b>shield / charter</b><span>every action checked</span></div>
        <div class="card s3-layer" style="top: 290px; background: #fbf7f1"><i>6</i><b>live UI</b><span>WebSocket · 71 typed events</span></div>
      </div>
      <script>
        (() => {
          const B = 2 / 3;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s3-a", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 0.14);
          tl.fromTo("#s3-b", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, B);
          tl.fromTo("#s3-c", { scale: 2.6, rotation: -9, opacity: 0 }, { scale: 1, rotation: -2, opacity: 1, duration: 0.28, ease: "power4.in" }, 2 * B - 0.28);
          tl.fromTo("#s3-type", { x: 0, y: 0 }, { x: 14, y: -10, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 2 * B);
          tl.fromTo("#s3-underp", { strokeDasharray: 1520, strokeDashoffset: 1520 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2 * B + 0.15);
          // the headline steps aside, the stack builds from the ground up on the off-beats
          tl.fromTo("#s3-type", { scale: 1, x: 0, y: 0 }, { scale: 0.5, x: 0, y: -50, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 4 * B - 0.3);
          tl.fromTo("#s3-lead", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power2.inOut" }, 4 * B + 0.1);
          tl.fromTo("#s3-arrowp", { strokeDasharray: 520, strokeDashoffset: 520 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 4 * B + 0.35);
          tl.fromTo("#s3-arrowh", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 4 * B + 0.75);
          gsap.utils.toArray(".s3-layer").forEach((el, i) => {
            tl.fromTo(el, { y: 320, opacity: 0, rotation: i % 2 ? 7 : -7 }, { y: 0, opacity: 1, rotation: i % 2 ? 0.8 : -0.8, duration: 0.4, ease: "back.out(1.6)" }, 4 * B + i * (B / 2));
          });
          tl.fromTo("#s3-rl", { scale: 1 }, { scale: 1.07, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 7 * B);
          tl.fromTo("#s3-rl i", { rotation: 0 }, { rotation: 360, duration: 0.6, ease: "power2.inOut" }, 7 * B);
          window.__timelines["s3-stack"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
