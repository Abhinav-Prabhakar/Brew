      <div id="s0-root" data-composition-id="s0-open" data-width="1920" data-height="1080">
        <div id="s0-wrap" class="wrap">
          <div id="s0-sun"></div>
          <!-- the quiet opening is a pencil sketch: a guideline where the logo will land, a cup, a line of handwriting -->

          <div id="s0-cupb" class="b">

              <path class="s0-c" pathLength="1" d="M70 250 h270 v90 a116 116 0 0 1 -116 116 h-38 a116 116 0 0 1 -116 -116 z" />
              <path class="s0-c" pathLength="1" d="M340 276 h34 a52 52 0 0 1 0 104 h-38" />

          <div id="s0-logob" class="b">

            <svg id="s0-heart" viewBox="0 0 108 104">
              <path d="M54 92 C 16 64 6 42 15 27 C 24 12 45 13 54 33 C 63 13 84 12 93 27 C 102 42 92 64 54 92 Z" fill="none" stroke="#1d1a1c" stroke-width="12" stroke-linejoin="round" transform="translate(5 5)" />
              <path d="M54 92 C 16 64 6 42 15 27 C 24 12 45 13 54 33 C 63 13 84 12 93 27 C 102 42 92 64 54 92 Z" fill="none" stroke="#b55c39" stroke-width="12" stroke-linejoin="round" />

          <svg class="doodle s0-spark" style="left: 1130px; top: 640px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>
          <svg class="doodle s0-spark" style="left: 1760px; top: 240px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>
          <svg class="doodle s0-spark" style="left: 720px; top: 100px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>
          <div id="s0-clock" class="card"><small>tue</small><span id="s0-time">07:00 am</span></div>

        </div>
      </div>
      <script>
        (() => {
          const { t, pop, write, draw, bump } = BREW;
          const at = (e) => t(e); // this scene starts at 0 s; the first stomp (e = 0) is just under a second in
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s0-sun", { y: 460, scale: 0.7 }, { y: 0, scale: 1, duration: at(8), ease: "power1.out" }, 0);
          // the breath before the first stomp: a pencil sketches the cup and the line
          draw(tl, "#s0-guide path", 0.02, 0.5);
          tl.fromTo(".s0-c", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, stagger: 0.1, ease: "power1.inOut" }, 0.05);
          tl.fromTo(".s0-s", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, stagger: 0.08, ease: "power1.inOut" }, 0.45);
          write(tl, "#s0-tag", 0.2, 0.7);
          tl.fromTo("#s0-wrap", { scale: 1.05 }, { scale: 0.97, duration: at(0), ease: "power1.in" }, 0);
          // stomp, stomp, stomp: the logo; the heart and its burst; the underline, the sparks and the clock
          tl.fromTo("#s0-wrap", { scale: 0.97 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, at(0));
          pop(tl, "#s0-logo", at(0), { from: 1.5, rot: -2, rot0: -6, y: 0, dur: 0.3 });
          tl.fromTo("#s0-guide", { opacity: 0.55 }, { opacity: 0, duration: 0.05, immediateRender: false }, at(0));
          pop(tl, "#s0-heart", at(1), { from: 1.8, rot: 0, rot0: 24, y: 0 });
          draw(tl, "#s0-burst path", at(1), 0.14, 0.02);
          draw(tl, "#s0-under path", at(2), 0.2);
          draw(tl, ".s0-spark path", at(2), 0.16, 0.05);
          pop(tl, "#s0-clock", at(2), { rot: 2, rot0: -6 });
          // two more: the door sign, and the morning running on to 08:08
          pop(tl, "#s0-open", at(5), { rot: -5, rot0: 8 });
          const clock = { m: 420 };
          const time = document.getElementById("s0-time");
          tl.to(clock, { m: 488, duration: 0.7, ease: "power1.inOut", onUpdate: () => {
            const m = Math.round(clock.m);
            time.textContent = "0" + Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + " am";
          } }, at(5));
          tl.fromTo("#s0-cupb", { y: 0, rotation: 0 }, { y: -14, rotation: 3, duration: at(8) - at(0), ease: "sine.inOut" }, at(0));
          bump(tl, ".s0-spark", t(2) + 0.2, t(8), { amt: 0.25, rot: 14, min: 0.3 });
          // the page whips away on the bar line
          tl.fromTo("#s0-wrap", { x: 0, skewX: 0 }, { x: -2300, skewX: 14, duration: 0.17, ease: "power3.in", immediateRender: false }, at(8) - 0.17);
          window.__timelines["s0-open"] = tl;
        })();
