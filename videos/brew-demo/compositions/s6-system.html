      <script>
        (() => {
          const { t, pop, hide, write, draw, bump, shake } = BREW;
          const S = t(64), at = (e) => t(e) - S;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s6-glow", { scale: 0.5, opacity: 0 }, { scale: 1.2, opacity: 1, duration: 2.8, ease: "power2.out" }, 0);
          // THE DROP. the full band comes in on these three words.
          pop(tl, "#s6-ml", 0, { from: 2.6, rot: -2, rot0: -8, dur: 0.18 });
          shake(tl, "#s6-shake", 0, 34, 9);
          draw(tl, ".s6-ray path", 0, 0.14, 0.012);
          draw(tl, "#s6-under path", at(65), 0.2, 0.12);
          draw(tl, ".s6-star path", at(66), 0.16, 0.06);
          write(tl, "#s6-note", at(69), 0.24);
          draw(tl, "#s6-down path", at(70), 0.12, 0.08);
          tl.fromTo("#s6-down", { y: 0 }, { y: 26, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, at(70) + 0.1);
          // bar two: the line steps aside and the stack is stomped in from the ground up (three hits, two hits, one)
          const T = at(72);
          hide(tl, "#s6-note", T, 0.04);
          hide(tl, "#s6-down", T, 0.04);
          hide(tl, ".s6-ray", T, 0.04);
          hide(tl, ".s6-star", T, 0.04);
          tl.fromTo("#s6-glow", { opacity: 1 }, { opacity: 0.35, duration: 0.3, immediateRender: false }, T);
          tl.fromTo("#s6-head", { scale: 1, x: 0, y: 0 }, { scale: 0.5, x: 0, y: -80, duration: 0.2, ease: "expo.out", immediateRender: false }, T);
          write(tl, "#s6-lead", T + 0.1, 0.22);
          draw(tl, "#s6-arrow path", at(73), 0.16, 0.1);
          const layers = gsap.utils.toArray(".s6-layer");
          [72, 73, 74, 77, 78, 80].forEach((e, i) => {
            tl.fromTo(layers[i], { opacity: 0, y: 300, rotation: i % 2 ? 9 : -9, scale: 1.25 }, { opacity: 1, y: 0, rotation: i % 2 ? 0.8 : -0.8, scale: 1, duration: 0.2, ease: "power4.out" }, at(e));
          });
          // bar three: the one that decides
          draw(tl, "#s6-ring path", at(81), 0.22);
          draw(tl, "#s6-crown path", at(82), 0.16);
          tl.fromTo("#s6-rl i", { rotation: 0 }, { rotation: 360, duration: 0.34, ease: "power2.out" }, at(82));
          pop(tl, "#s6-t1", at(85), { rot: -2, rot0: 10 });
          pop(tl, "#s6-t2", at(86), { rot: 2, rot0: -10 });
          // the band is playing: everything takes every hit
          bump(tl, "#s6-headb", t(65), t(88), { amt: 0.045, rot: 0.5, min: 0.5 });
          bump(tl, "#s6-stackb", t(75), t(88), { amt: 0.03, rot: 0.6, min: 0.5 });
          bump(tl, "#s6-crown", t(83), t(88), { amt: 0.3, rot: 12, min: 0.3 });
          window.__timelines["s6-system"] = tl;
        })();
      </script>
