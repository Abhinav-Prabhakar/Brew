<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s4-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s4-win {
          left: 70px;
          top: 110px;
          width: 1216px;
          height: 760px;
        }
        #s4-tape {
          position: absolute;
          left: -100px;
          top: 912px;
          width: 2200px;
          height: 54px;
          border-top: 4px solid var(--ink);
          border-bottom: 4px solid var(--ink);
          background: repeating-linear-gradient(-45deg, #e3b25a 0 44px, #1d1a1c 44px 88px);
        }
        #s4-flash {
          position: absolute;
          inset: 0;
          background: var(--terra);
        }
        #s4-stamp {
          left: 1346px;
          top: 120px;
        }
        #s4-title {
          left: 1342px;
          top: 214px;
          width: 540px;
          font-size: 80px;
        }
        #s4-down {
          left: 760px;
          top: 150px;
          font-size: 120px;
          padding: 10px 34px 18px;
          border-width: 6px;
          box-shadow: 10px 10px 0 var(--ink);
        }
        #s4-n1 {
          left: 1346px;
          top: 480px;
          width: 520px;
        }
        #s4-replan {
          left: 1346px;
          top: 556px;
          font-size: 46px;
        }
        #s4-n2 {
          left: 1346px;
          top: 668px;
          width: 520px;
          font-size: 46px;
        }
        .s4-chip {
          font-size: 30px;
          padding: 9px 16px 11px;
          border-width: 3px;
          border-radius: 13px;
          box-shadow: 4px 4px 0 var(--ink);
        }
      </style>
      <div id="s4-root" data-composition-id="s4-kitchen" data-width="1920" data-height="1080">
        <div id="s4-flash"></div>
        <div id="s4-tape"></div>
        <div id="s4-win" class="win">
          <div id="s4-cam" class="cam">
            <video id="s4-vid" class="clip" src="assets/clips/kitchen.mp4" muted playsinline data-start="0" data-duration="8" data-track-index="0"></video>
          </div>
        </div>
        <div id="s4-stamp" class="stamp">08:30</div>
        <div id="s4-title" class="title">the espresso machine <em>breaks</em></div>
        <div id="s4-down" class="tag terra">DOWN</div>
        <div id="s4-n1" class="note">technician on the way…</div>
        <div id="s4-replan" class="tag sage">policy D re-plans, at once</div>
        <div id="s4-n2" class="note">chaos you can press:</div>
        <div class="tag paper s4-chip" style="left: 1346px; top: 736px">barista sick</div>
        <div class="tag paper s4-chip" style="left: 1560px; top: 736px">oven breaks</div>
        <div class="tag paper s4-chip" style="left: 1346px; top: 802px">milk late</div>
        <div class="tag paper s4-chip" style="left: 1522px; top: 802px">rain storm</div>
        <div class="tag paper s4-chip" style="left: 1346px; top: 868px">no riders</div>
        <div class="tag paper s4-chip" style="left: 1522px; top: 868px">power cut</div>
      </div>
      <script>
        (() => {
          const B = 2 / 3;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s4-flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo("#s4-win", { x: -900, rotation: -6 }, { x: 0, rotation: 1, duration: 0.6, ease: "back.out(1.2)" }, 0.12);
          tl.fromTo("#s4-stamp", { scale: 0, rotation: 20 }, { scale: 1, rotation: 3, duration: 0.4, ease: "back.out(2.4)" }, 0.3);
          tl.fromTo("#s4-title", { x: 560, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.45);
          // 08:30:00, two beats in: the machine goes down
          const T = 2 * B;
          tl.fromTo("#s4-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, T);
          [[-22, 10], [18, -12], [-14, -8], [12, 9], [-7, 5], [4, -3], [0, 0]].forEach(([x, y], i) => {
            tl.to("#s4-win", { x, y, duration: 0.055, ease: "none" }, T + i * 0.055);
          });
          tl.fromTo("#s4-down", { scale: 3.4, rotation: -30, opacity: 0 }, { scale: 1, rotation: -9, opacity: 1, duration: 0.2, ease: "power4.in" }, T - 0.2);
          tl.fromTo("#s4-down", { scale: 1, x: 0, y: 0 }, { scale: 0.42, x: 250, y: -110, duration: 0.5, ease: "power3.inOut", immediateRender: false }, T + 1.5);
          tl.fromTo("#s4-tape", { x: -2300 }, { x: 0, duration: 0.5, ease: "power3.out" }, T);
          tl.fromTo("#s4-tape", { backgroundPositionX: 0 }, { backgroundPositionX: 372, duration: 6, ease: "none", immediateRender: false }, T);
          tl.fromTo("#s4-n1", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power2.inOut" }, 4 * B);
          tl.fromTo("#s4-replan", { scale: 0, rotation: 10 }, { scale: 1, rotation: -2, duration: 0.45, ease: "back.out(2.2)" }, 5 * B);
          tl.fromTo("#s4-n2", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power2.inOut" }, 7 * B);
          gsap.utils.toArray(".s4-chip").forEach((el, i) => {
            tl.fromTo(el, { scale: 0, rotation: i % 2 ? 14 : -14 }, { scale: 1, rotation: i % 2 ? 1.5 : -1.5, duration: 0.3, ease: "back.out(2.6)" }, 8 * B + i * (B / 4));
            tl.fromTo(el, { y: 0 }, { y: 7, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.in", immediateRender: false }, 10 * B + i * (B / 4));
          });
          window.__timelines["s4-kitchen"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
