      <script>
        (() => {
          const { t, pop, write, draw, bump, cam } = BREW;
          const S = t(48), at = (e) => t(e) - S;
          const c = (cx, cy, s) => cam(1264, 790, cx, cy, s);
          const wide = c(800, 500, 1), board = c(1150, 420, 1.45), board2 = c(1160, 430, 1.55), slip = c(820, 560, 1.5), slip2 = c(800, 540, 1.62);

          // (the ink iris is opening) the window settles with the title; stomp: the first line and the board
          tl.fromTo("#s8-cam", wide, { ...wide, duration: 0.01 }, 0);
          tl.fromTo("#s8-win", { scale: 1.12, rotation: 3 }, { scale: 1, rotation: 1, duration: 0.34, ease: "expo.out" }, 0);

          pop(tl, "#s8-stamp", 0.16, { rot: -3, rot0: -10 });
          pop(tl, "#s8-say1", at(49), { rot0: -4 });
          tl.fromTo("#s8-cam", wide, { ...board, duration: 0.3, ease: "expo.out", immediateRender: false }, at(49));
          tl.fromTo("#s8-cam", board, { ...board2, duration: at(52) - at(49) - 0.3, ease: "none", immediateRender: false }, at(49) + 0.3);
          draw(tl, ".s8-note path", at(50), 0.14, 0.06);
          // half way through the bar the footage cuts to the order; the two stomps after: the line, the ticket
          tl.fromTo("#s8-cam", slip, { ...slip2, duration: at(56) - at(52), ease: "none", immediateRender: false }, at(52));

          write(tl, "#s8-n2", at(53), 0.22);
          draw(tl, "#s8-arrow path", at(53), 0.2);
          tl.fromTo("#s8-pool", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, at(54));
          bump(tl, ".s8-note", t(50) + 0.2, t(56), { amt: 0.3, rot: 14, min: 0.3 });
          window.__timelines["s8-kapi"] = tl;
