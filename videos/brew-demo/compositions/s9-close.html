      <script>
        (() => {
          const B = 2 / 3;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s9-fade", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo("#s9-moon", { y: 240, opacity: 0 }, { y: 0, opacity: 1, duration: 6, ease: "power1.out" }, 0);
          tl.fromTo("#s9-slot", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
          tl.fromTo("#s9-stamp", { scale: 0, rotation: 20 }, { scale: 1, rotation: 3, duration: 0.4, ease: "back.out(2.4)" }, 0.3);
          // the day prints: the sheet feeds out in steps, like the café's own printer
          tl.fromTo("#s9-paper", { y: -790 }, { y: 0, duration: 2.3, ease: "steps(22)" }, 0.3);
          // the last chord lands on the scene's second bar: the logo
          const T = 4 * B;
          tl.fromTo("#s9-logo", { scale: 0, rotation: -12 }, { scale: 1, rotation: -2, duration: 0.7, ease: "elastic.out(1, 0.5)" }, T - 0.05);
          [6, 7, 8, 9, 10].forEach((b) => {
            tl.fromTo("#s9-heart", { scale: 1 }, { scale: 1.22, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, b * B);
          });
          tl.fromTo("#s9-tagline", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, T + 0.4);
          tl.fromTo("#s9-cmd", { scale: 0, rotation: 10 }, { scale: 1, rotation: -2, duration: 0.45, ease: "back.out(2.2)" }, 7 * B);
          tl.fromTo("#s9-repo", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 8 * B);
          tl.fromTo("#s9-fade", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 7.25);
          window.__timelines["s9-close"] = tl;
        })();
      </script>
