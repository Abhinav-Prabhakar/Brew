      </style>
      <div id="s1-root" data-composition-id="s1-lobby" data-width="1920" data-height="1080">
        <div id="s1-wrap" class="wrap">
          <div id="s1-winb" class="b">
            <div id="s1-win" class="win">
              <div id="s1-cam" class="cam">

              </div>
            </div>
          </div>
          <div id="s1-col" class="col">
            <div id="s1-stamp" class="stamp">08:08</div>
            <div id="s1-title" class="title"><span>the morning</span><em>rush</em></div>
            <div id="s1-n1" class="note s1-note" style="top: 540px">→ tickets hit the rail</div>
            <div id="s1-n2" class="note s1-note" style="top: 630px">→ customers lose patience</div>
            <div id="s1-n3" class="note s1-note" style="top: 720px">→ every number is live</div>
          </div>
          <svg id="s1-circle" class="doodle terra" viewBox="0 0 500 220"><path pathLength="1" d="M250 16 C 100 6 14 54 20 116 C 26 182 180 208 280 202 C 410 196 486 150 480 98 C 474 40 350 6 200 22" /></svg>
          <svg id="s1-arrow" class="doodle" viewBox="0 0 250 190"><path pathLength="1" d="M14 176 Q 60 40 226 30" /><path pathLength="1" d="M180 8 L230 30 L190 70" /></svg>
          <div id="s1-t1" class="tag mustard s1-tag" style="left: 1240px; top: 480px">the ticket rail</div>
          <div id="s1-t2" class="tag sage s1-tag" style="left: 700px; top: 250px">patience, ticking</div>
          <div id="s1-t3" class="tag terra s1-tag" style="left: 1130px; top: 250px">the manager says why</div>
          <svg class="doodle s1-spark" style="left: 1760px; top: 40px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>
          <svg class="doodle s1-spark" style="left: 1480px; top: 20px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>
          <svg class="doodle s1-spark" style="left: 1846px; top: 190px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>
        </div>
      </div>
      <script>
        (() => {
          const { t, pop, hide, write, draw, bump, cam } = BREW;
          const S = t(8), at = (e) => t(e) - S;
          const c = (cx, cy, s) => cam(1296, 810, cx, cy, s);
          const wide = c(800, 500, 1), wide2 = c(760, 470, 1.08), rail = c(430, 170, 1.9), rail2 = c(480, 190, 2.02),
            queue = c(1180, 560, 2), queue2 = c(1140, 560, 2.12), card = c(520, 890, 1.9), card2 = c(560, 880, 2.02);
          const tl = gsap.timeline({ paused: true });
          // the camera never stands still: it glides inside each shot and snaps to the next one on a stomp
          const shot = (a, b, e0, e1, first) => {
            tl.fromTo("#s1-cam", first ? a : a, { ...b, duration: at(e1) - at(e0), ease: "none", immediateRender: !!first }, at(e0));
          };
          shot(wide, wide2, 8, 10, true);
          shot(rail, rail2, 10, 13);
          shot(queue, queue2, 13, 14);
          shot(card, card2, 14, 16);
          shot(wide2, wide, 16, 20);
          // the downbeat: the page whips in with its stamp and title already landing
          tl.fromTo("#s1-wrap", { x: 2300, skewX: 14 }, { x: 0, skewX: 0, duration: 0.2, ease: "power3.out" }, 0);
          pop(tl, "#s1-stamp", 0.08, { rot: -3, rot0: -10 });
          pop(tl, "#s1-title span", 0.14, { rot0: -3 });
          pop(tl, "#s1-title em", 0.2, { from: 1.4, rot: -3, rot0: 5 });
          // stomp: the rail is circled and named. stomp: into it.
          draw(tl, "#s1-circle path", at(9), 0.2);
          draw(tl, "#s1-arrow path", at(9) + 0.06, 0.14, 0.08);
          write(tl, "#s1-n1", at(9), 0.24);
          hide(tl, "#s1-circle", at(10), 0.05);
          hide(tl, "#s1-arrow", at(10), 0.05);
          pop(tl, "#s1-t1", at(10), { rot: 3, rot0: 9 });
          // the two after the gap: the queue, the decision card
          hide(tl, "#s1-t1", at(13), 0.05);
          pop(tl, "#s1-t2", at(13), { rot: -3, rot0: -9 });
          write(tl, "#s1-n2", at(13), 0.24);
          hide(tl, "#s1-t2", at(14), 0.05);
          pop(tl, "#s1-t3", at(14), { rot: 2, rot0: 8 });
          // next downbeat: back out, the last note and its sparks
          hide(tl, "#s1-t3", at(16), 0.05);
          write(tl, "#s1-n3", at(16), 0.24);
          draw(tl, ".s1-spark path", at(17), 0.14, 0.04);
          bump(tl, ".s1-spark", t(17) + 0.2, t(20), { amt: 0.25, rot: 14, min: 0.3 });
          // out: straight through the window into the kitchen
          tl.fromTo("#s1-wrap", { scale: 1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.17, ease: "power3.in", immediateRender: false }, at(20) - 0.17);
          window.__timelines["s1-lobby"] = tl;
        })();
      </script>
    </template>
