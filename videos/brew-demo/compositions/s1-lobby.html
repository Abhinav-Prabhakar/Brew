      <div id="s1-root" data-composition-id="s1-lobby" data-width="1920" data-height="1080">

          </div>

            <div id="s1-n1" class="note s1-note" style="top: 540px">→ tickets hit the rail</div>

          </div>

          <svg class="doodle s1-spark" style="left: 1846px; top: 190px" viewBox="0 0 80 80"><path pathLength="1" d="M40 4 Q44 36 76 40 Q44 44 40 76 Q36 44 4 40 Q36 36 40 4 Z" /></svg>

      <script>
        (() => {
          const { t, pop, hide, write, draw, bump, cam } = BREW;
          const S = t(8), at = (e) => t(e) - S;
          const c = (cx, cy, s) => cam(1296, 810, cx, cy, s);
          const wide = c(800, 500, 1), rail = c(430, 170, 1.9), queue = c(1180, 560, 2), card = c(520, 890, 1.9);
          const snap = (from, to, e) => tl.fromTo("#s1-cam", from, { ...to, duration: 0.16, ease: "expo.out", immediateRender: false }, at(e));
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s1-cam", wide, { ...wide, duration: 0.01 }, 0);
          // the page whips in on the bar line; stamp, title on the next two stomps
          tl.fromTo("#s1-wrap", { x: 2300, skewX: 14 }, { x: 0, skewX: 0, duration: 0.2, ease: "power3.out" }, 0);
          pop(tl, "#s1-stamp", at(9), { from: 2.2, rot: -3, rot0: -20 });
          pop(tl, "#s1-title span", at(10), { from: 1.5, rot: 0, rot0: -4 });
          pop(tl, "#s1-title em", at(10) + 0.09, { from: 2.2, rot: -3, rot0: 8 });
          // hit, hit: the rail is circled, the note points at it
          draw(tl, "#s1-circle path", at(13), 0.2);
          write(tl, "#s1-n1", at(13), 0.24);
          draw(tl, "#s1-arrow path", at(14), 0.14, 0.1);
          // bar two: three stomps, three snap zooms
          hide(tl, "#s1-circle", at(16), 0.05);
          hide(tl, "#s1-arrow", at(16), 0.05);
          snap(wide, rail, 16);
          pop(tl, "#s1-t1", at(16), { rot: 3, rot0: 14 });
          hide(tl, "#s1-t1", at(17), 0.05);
          snap(rail, queue, 17);
          pop(tl, "#s1-t2", at(17), { rot: -3, rot0: -14 });
          write(tl, "#s1-n2", at(17), 0.24);
          hide(tl, "#s1-t2", at(18), 0.05);
          snap(queue, card, 18);
          pop(tl, "#s1-t3", at(18), { rot: 2, rot0: 12 });
          // hit, hit: back out, and the last note with its sparks
          hide(tl, "#s1-t3", at(21), 0.05);
          snap(card, wide, 21);
          write(tl, "#s1-n3", at(22), 0.24);
          draw(tl, ".s1-spark path", at(22), 0.14, 0.04);
          // everything on screen takes the beat
          bump(tl, "#s1-winb", t(9), t(24), { amt: 0.028, rot: 0.5 });
          bump(tl, "#s1-col", t(11), t(24), { amt: 0.02, y: 9 });
          bump(tl, ".s1-spark", t(22) + 0.2, t(24), { amt: 0.5, rot: 25, min: 0.2 });
          // out: straight through the window into the kitchen
          tl.fromTo("#s1-wrap", { scale: 1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.17, ease: "power3.in", immediateRender: false }, at(24) - 0.17);
          window.__timelines["s1-lobby"] = tl;
        })();
      </script>
