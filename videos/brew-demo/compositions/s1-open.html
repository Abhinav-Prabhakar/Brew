<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s1-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s1-sun {
          position: absolute;
          left: -260px;
          top: 420px;
          width: 1100px;
          height: 1100px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(227, 178, 90, 0.75), rgba(247, 195, 163, 0.45) 45%, rgba(247, 195, 163, 0) 70%);
        }
        #s1-railline {
          position: absolute;
          left: 0;
          top: 96px;
          width: 1920px;
          height: 6px;
          background: var(--ink);
          transform-origin: 0 50%;
        }
        .s1-ticket {
          position: absolute;
          top: 96px;
          width: 190px;
          height: 236px;
          transform-origin: 50% 0;
          background: var(--paper);
          border: 4px solid var(--ink);
          border-radius: 6px 6px 14px 14px;
          box-shadow: 7px 7px 0 var(--ink);
          padding: 34px 16px 0;
          font-family: var(--mono);
          font-weight: 700;
          font-size: 26px;
          line-height: 1.25;
        }
        .s1-ticket b {
          display: block;
          font-family: var(--hand);
          font-weight: 400;
          font-size: 44px;
          margin-bottom: 8px;
        }
        .s1-ticket i {
          position: absolute;
          left: 50%;
          top: -22px;
          margin-left: -11px;
          width: 22px;
          height: 46px;
          background: var(--kraft);
          border: 4px solid var(--ink);
          border-radius: 5px;
        }
        #s1-logo {
          position: absolute;
          left: 130px;
          top: 250px;
          display: flex;
          font-family: var(--hand);
          font-size: 380px;
          line-height: 1;
          color: #b55c39;
          text-shadow: 10px 10px 0 var(--ink);
          letter-spacing: 6px;
        }
        #s1-logo span {
          display: block;
        }
        #s1-heart {
          display: block;
          margin: 96px 0 0 26px;
          transform-origin: 50% 60%;
        }
        #s1-tag {
          position: absolute;
          left: 160px;
          top: 690px;
          width: 1100px;
          font-family: var(--note);
          font-weight: 700;
          font-size: 104px;
          line-height: 1;
          color: var(--ink);
        }
        #s1-clock {
          left: 1270px;
          top: 560px;
          width: 540px;
          height: 170px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 22px;
          font-family: var(--hand);
          font-size: 84px;
          line-height: 1;
        }
        #s1-clock small {
          font-family: var(--mono);
          font-weight: 700;
          font-size: 34px;
        }
        #s1-open {
          left: 1430px;
          top: 800px;
          font-size: 64px;
          transform-origin: 50% -40px;
        }
      </style>
      <div id="s1-root" data-composition-id="s1-open" data-width="1920" data-height="1080">
        <div id="s1-sun"></div>
        <div id="s1-railline"></div>
        <div class="s1-ticket" style="left: 1180px"><i></i><b>#001</b>filter coffee</div>
        <div class="s1-ticket" style="left: 1420px"><i></i><b>#002</b>latte<br />croissant</div>
        <div class="s1-ticket" style="left: 1660px"><i></i><b>#003</b>masala chai</div>
        <div id="s1-logo"><span>b</span><span>r</span><span>e</span><span>w</span><svg id="s1-heart" viewBox="0 0 108 104" style="width: 250px; height: 250px">
            <path d="M54 92 C 16 64 6 42 15 27 C 24 12 45 13 54 33 C 63 13 84 12 93 27 C 102 42 92 64 54 92 Z" fill="none" stroke="#1d1a1c" stroke-width="12" stroke-linejoin="round" transform="translate(5 5)" />
            <path d="M54 92 C 16 64 6 42 15 27 C 24 12 45 13 54 33 C 63 13 84 12 93 27 C 102 42 92 64 54 92 Z" fill="none" stroke="#b55c39" stroke-width="12" stroke-linejoin="round" />
          </svg></div>
        <div id="s1-tag">a cosy little café</div>
        <div id="s1-clock" class="card"><small>tue</small><span id="s1-time">07:00 am</span></div>
        <div id="s1-open" class="tag terra">open ♡</div>
      </div>
      <script>
        (() => {
          const B = 2 / 3;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s1-sun", { y: 420, scale: 0.7 }, { y: 0, scale: 1, duration: 5.3, ease: "power1.out" }, 0);
          tl.fromTo("#s1-railline", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.2);
          // the logo: letter by letter, then the heart beats on the beat
          tl.fromTo("#s1-logo > *", { y: 160, opacity: 0, rotation: -14, scale: 0.6 }, { y: 0, opacity: 1, rotation: 0, scale: 1, duration: 0.55, stagger: 0.09, ease: "back.out(2.2)" }, 0.08);
          [2, 3, 4, 5, 6, 7].forEach((b) => {
            tl.fromTo("#s1-heart", { scale: 1 }, { scale: 1.22, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, b * B);
          });
          tl.fromTo("#s1-tag", { clipPath: "inset(0 100% 0 0)", x: -20 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.9, ease: "power2.inOut" }, 1.0);
          // tickets drop onto the rail and swing
          gsap.utils.toArray(".s1-ticket").forEach((el, i) => {
            const t = 2 * B + i * B;
            tl.fromTo(el, { y: -420, rotation: 14 }, { y: 0, rotation: -7, duration: 0.34, ease: "power3.in" }, t - 0.34);
            tl.fromTo(el, { rotation: -7 }, { rotation: i % 2 ? 2 : -2, duration: 1.6, ease: "elastic.out(1.2, 0.3)", immediateRender: false }, t);
          });
          // the clock card, and the door sign
          tl.fromTo("#s1-clock", { scale: 0, rotation: -10 }, { scale: 1, rotation: 2, duration: 0.5, ease: "back.out(2)" }, 4 * B);
          tl.fromTo("#s1-open", { scale: 0, rotation: 30 }, { scale: 1, rotation: -5, duration: 0.9, ease: "elastic.out(1, 0.45)" }, 5 * B);
          // ...and the morning runs on to 08:08
          const clock = { m: 420 };
          const time = document.getElementById("s1-time");
          tl.to(clock, {
            m: 488,
            duration: 1.25,
            ease: "power2.in",
            onUpdate: () => {
              const m = Math.round(clock.m);
              time.textContent = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") + " am";
            },
          }, 6 * B);
          tl.fromTo("#s1-clock", { y: 0 }, { y: -10, duration: 0.1, yoyo: true, repeat: 11, ease: "sine.inOut", immediateRender: false }, 6 * B);
          window.__timelines["s1-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
