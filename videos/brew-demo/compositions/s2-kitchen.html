          <svg id="s2-arrow" class="doodle" viewBox="0 0 250 150"><path pathLength="1" d="M240 20 Q 130 10 24 110" /><path pathLength="1" d="M20 56 L22 112 L78 104" /></svg>

          <svg class="doodle s2-bolt" style="left: 1200px; top: 770px" viewBox="0 0 110 140"><path pathLength="1" d="M70 6 L20 74 L52 74 L34 134 L92 58 L60 58 Z" /></svg>

      <script>
        (() => {
          const { t, pop, hide, write, draw, bump, shake, cam } = BREW;
          const S = t(24), at = (e) => t(e) - S;
          const c = (cx, cy, s) => cam(1216, 760, cx, cy, s);
          const wide = c(800, 500, 1), machine = c(960, 470, 1.45);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s2-flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo("#s2-cam", wide, { ...wide, duration: 0.01 }, 0);
          // in: through the lobby's window
          tl.fromTo("#s2-wrap", { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 0);
          pop(tl, "#s2-stamp", at(25), { from: 2.2, rot: 3, rot0: 20 });
          pop(tl, "#s2-title span", at(26), { from: 1.5, rot0: 5, stagger: 0.07 });
          // this bar's odd hits (eighths 4 and 6): hold your breath
          write(tl, "#s2-wait", at(28), 0.3);
          draw(tl, "#s2-arrow path", at(30), 0.14, 0.1);
          tl.fromTo("#s2-cam", wide, { ...machine, duration: 0.5, ease: "power2.in", immediateRender: false }, at(30));
          // the downbeat of the next bar is 08:30:00 in the footage
          const T = at(32);
          hide(tl, "#s2-wait", T, 0.04);
          hide(tl, "#s2-arrow", T, 0.04);
          tl.fromTo("#s2-flash", { opacity: 0.7 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, T);
          tl.fromTo("#s2-cam", machine, { ...wide, duration: 0.16, ease: "expo.out", immediateRender: false }, T);
          shake(tl, "#s2-root", T, 26, 8);
          pop(tl, "#s2-down", T, { from: 3.2, rot: -9, rot0: -30, dur: 0.16 });
          pop(tl, "#s2-title em", T, { from: 2.4, rot: -3, rot0: 10 });
          draw(tl, ".s2-bolt path", T, 0.12, 0.05);
          tl.fromTo("#s2-tape", { x: -2400 }, { x: 0, duration: 0.24, ease: "power3.out" }, at(33));
          tl.fromTo("#s2-tape", { backgroundPositionX: 0 }, { backgroundPositionX: 248, duration: 2.6, ease: "none", immediateRender: false }, at(33));
          tl.fromTo("#s2-down", { scale: 1, x: 0, y: 0 }, { scale: 0.46, x: 248, y: -112, duration: 0.16, ease: "expo.out", immediateRender: false }, at(34));
          pop(tl, "#s2-replan", at(34), { rot: -2, rot0: 10 });
          // the last two hits: the chaos buttons, three and three
          write(tl, "#s2-n2", at(37) - 0.12, 0.2);
          const chips = gsap.utils.toArray(".s2-chip");
          pop(tl, chips.slice(0, 3), at(37), { from: 2, rot0: 14, stagger: 0.06 });
          pop(tl, chips.slice(3), at(38), { from: 2, rot0: -14, stagger: 0.06 });
          bump(tl, "#s2-winb", t(25), t(40), { amt: 0.028, rot: 0.6 });
          bump(tl, "#s2-col", t(27), t(40), { amt: 0.02, y: 9 });
          bump(tl, ".s2-bolt", t(33), t(40), { amt: 0.35, rot: 14 });
          window.__timelines["s2-kitchen"] = tl;
        })();
