      <script>
        (() => {
          const { t, hits, pop, write, draw, bump, length } = BREW;
          const S = t(128), at = (e) => t(e) - S;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s10-fade", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo("#s10-night", { y: 240, opacity: 0 }, { y: 0, opacity: 1, duration: 5, ease: "power1.out" }, 0);
          // the break: the band drops out, the stomps come back. night has fallen.
          tl.fromTo("#s10-slot", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.3);
          draw(tl, "#s10-moon path", 0.25, 0.5);
          pop(tl, "#s10-stamp", at(130), { from: 2.2, rot: 3, rot0: 20 });
          // the day prints: the receipt feeds out one notch on every stomp of two bars
          const feed = hits(S, t(144), 0.6);
          const H = 790;
          feed.forEach((h, i) => {
            const y0 = -H + (H * i) / feed.length, y1 = -H + (H * (i + 1)) / feed.length;
            tl.fromTo("#s10-paper", { y: y0 }, { y: y1, duration: 0.11, ease: "power2.out", immediateRender: i === 0 }, h.t);
          });
          bump(tl, "#s10-paperb", S, t(144), { amt: 0.03, min: 0.6 });
          const lines = gsap.utils.toArray(".s10-line"), ticks = gsap.utils.toArray(".s10-tick path");
          [133, 136, 138].forEach((e, i) => {
            pop(tl, lines[i], at(e), { from: 1.6, rot: i % 2 ? 1.5 : -1.5, rot0: i % 2 ? -7 : 7 });
            draw(tl, ticks[i], at(e) + 0.12, 0.12);
          });
          bump(tl, "#s10-linesb", t(134), t(144), { amt: 0.03, rot: 0.4, min: 0.6 });
          tl.fromTo("#s10-lines", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.8, duration: 0.1, ease: "power2.in", transformOrigin: "70% 50%", immediateRender: false }, at(144) - 0.1);
          // bar three: stomp, stomp, stomp: the logo, the heart, the line. then the two that tell you how to run it.
          pop(tl, "#s10-logo", at(144), { from: 2.4, rot: -2, rot0: -10, dur: 0.18 });
          pop(tl, "#s10-heart", at(145), { from: 2.6, rot: 0, rot0: 30 });
          draw(tl, "#s10-under path", at(146), 0.18);
          write(tl, "#s10-tagline", at(146), 0.6);
          pop(tl, "#s10-cmd", at(149), { rot: -2, rot0: 10 });
          pop(tl, "#s10-repo", at(150), { from: 1.3, rot0: 0 });
          // the last bar: the heart takes every stomp, small hearts answer
          bump(tl, "#s10-logob", t(145), length, { amt: 0.05, rot: 0.8, min: 0.5 });
          gsap.utils.toArray(".s10-h").forEach((el, i) => draw(tl, el.querySelector("path"), at([152, 154, 156][i]), 0.16));
          bump(tl, ".s10-h", t(153), length, { amt: 0.4, rot: 16, min: 0.4 });
          // out with the music's fade
          tl.fromTo("#s10-fade", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.inOut", immediateRender: false }, length - S - 0.85);
          window.__timelines["s10-close"] = tl;
        })();
