<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s8-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s8-glow {
          position: absolute;
          left: 760px;
          top: 240px;
          width: 1300px;
          height: 1300px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(224, 126, 82, 0.5), rgba(224, 126, 82, 0) 65%);
        }
        #s8-head {
          position: absolute;
          left: 110px;
          top: 150px;
          width: 1700px;
          height: 620px;
          transform-origin: 0 0;
        }
        .s8-line {
          position: absolute;
          left: 0;
          font-family: var(--hand);
          font-size: 210px;
          line-height: 1;
          white-space: nowrap;
          transform-origin: 20% 60%;
        }
        #s8-l1 {
          top: 0;
        }
        #s8-l2 {
          top: 220px;
          color: var(--terra-ink);
        }
        #s8-sub {
          position: absolute;
          left: 10px;
          top: 480px;
          font-family: var(--body);
          font-size: 56px;
          line-height: 1;
          white-space: nowrap;
        }
        .s8-row {
          position: absolute;
          left: 110px;
          width: 1700px;
          height: 96px;
        }
        .s8-row b {
          position: absolute;
          left: 0;
          top: 14px;
          width: 340px;
          font-family: var(--hand);
          font-weight: 400;
          font-size: 56px;
          line-height: 1;
          white-space: nowrap;
        }
        .s8-bar {
          position: absolute;
          left: 360px;
          top: 6px;
          height: 80px;
          border: 4px solid var(--ink);
          border-radius: 14px;
          box-shadow: 7px 7px 0 var(--ink);
          transform-origin: 0 50%;
        }
        .s8-val {
          position: absolute;
          top: 10px;
          font-family: var(--hand);
          font-size: 64px;
          line-height: 1;
          white-space: nowrap;
          font-variant-numeric: tabular-nums;
        }
        #s8-delta {
          left: 1230px;
          top: 70px;
          width: 590px;
          height: 200px;
          background: var(--terra);
          padding: 18px 28px;
        }
        #s8-delta b {
          display: block;
          font-family: var(--hand);
          font-weight: 400;
          font-size: 96px;
          line-height: 1;
          white-space: nowrap;
        }
        #s8-delta > span {
          display: block;
          margin-top: 10px;
          font-family: var(--body);
          font-size: 32px;
          white-space: nowrap;
          line-height: 1.1;
        }
        .s8-chip {
          top: 858px;
          font-size: 40px;
        }
        #s8-honest {
          left: 116px;
          top: 950px;
          width: 1700px;
          font-size: 46px;
        }
        .s8-spark {
          position: absolute;
          left: 1470px;
          top: 742px;
          width: 14px;
          height: 46px;
          margin: -23px 0 0 -7px;
          border-radius: 7px;
          background: var(--ink);
        }
      </style>
      <div id="s8-root" data-composition-id="s8-arena" data-width="1920" data-height="1080">
        <div id="s8-glow"></div>
        <div id="s8-head">
          <div id="s8-l1" class="s8-line">same customers.</div>
          <div id="s8-l2" class="s8-line">four managers.</div>
          <div id="s8-sub">10 seeds × 7 days · common random numbers · held-out seeds</div>
        </div>
        <div class="s8-row" style="top: 300px"><b>A · naive</b><div class="s8-bar" style="width: 592px; background: #c9a27a"></div><div class="s8-val" style="left: 978px">₹<span>0</span></div></div>
        <div class="s8-row" style="top: 436px"><b>B · heuristic</b><div class="s8-bar" style="width: 700px; background: #e3b25a"></div><div class="s8-val" style="left: 1086px">₹<span>0</span></div></div>
        <div class="s8-row" style="top: 572px"><b>C · optimiser</b><div class="s8-bar" style="width: 924px; background: #8fa585"></div><div class="s8-val" style="left: 1310px">₹<span>0</span></div></div>
        <div class="s8-row" id="s8-rowd" style="top: 708px"><b>D · learned</b><div class="s8-bar" style="width: 1000px; background: #e07e52"></div><div class="s8-val" style="left: 1386px">₹<span>0</span></div></div>
        <div class="s8-spark"></div><div class="s8-spark"></div><div class="s8-spark"></div><div class="s8-spark"></div><div class="s8-spark"></div><div class="s8-spark"></div><div class="s8-spark"></div><div class="s8-spark"></div>
        <div id="s8-delta" class="card"><b>+₹<span id="s8-dnum">0</span></b><span>a day over naive · 95% CI ₹38.5k to ₹47.3k</span></div>
        <div class="tag paper s8-chip" style="left: 116px">10 of 10 seeds won</div>
        <div class="tag sage s8-chip" style="left: 560px">late orders 13.9% → 8.8%</div>
        <div class="tag mustard s8-chip" style="left: 1130px">walk-outs 119 → 65</div>
        <div id="s8-honest" class="note">honest read: the optimiser still wastes less (6.4 kg vs 10.4 kg a day)</div>
      </div>
      <script>
        (() => {
          const B = 2 / 3;
          const inr = (n) => {
            const s = String(Math.round(n));
            return s.length <= 3 ? s : s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + s.slice(-3);
          };
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s8-glow", { scale: 0.6, opacity: 0 }, { scale: 1.15, opacity: 1, duration: 10.6, ease: "power1.out" }, 0);
          // the claim, slammed on the first two beats
          tl.fromTo("#s8-l1", { scale: 2.4, rotation: 5, opacity: 0 }, { scale: 1, rotation: -1, opacity: 1, duration: 0.26, ease: "power4.in" }, 0.06);
          tl.fromTo("#s8-l2", { x: -1900, skewX: 20 }, { x: 0, skewX: 0, duration: 0.3, ease: "power4.out" }, 2 * B - 0.12);
          tl.fromTo("#s8-head", { x: 0, y: 0 }, { x: 12, y: -8, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 0.32);
          tl.fromTo("#s8-sub", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 3 * B - 0.1);
          tl.fromTo("#s8-head", { scale: 1, x: 0, y: 0 }, { scale: 0.4, x: 4, y: -90, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 4 * B - 0.3);
          tl.fromTo("#s8-sub", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, 4 * B - 0.3);
          // four bars, one per beat; D lands on the bar line
          const rows = gsap.utils.toArray(".s8-row");
          const vals = [62112, 73465, 96948, 104885];
          const starts = [4 * B + 0.1, 5 * B + 0.1, 6 * B + 0.1, 7 * B - 0.1];
          const durs = [0.5, 0.5, 0.5, 0.76];
          rows.forEach((row, i) => {
            const p = { v: 0 };
            const out = row.querySelector(".s8-val span");
            tl.fromTo(row.querySelector("b"), { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, starts[i] - 0.1);
            tl.fromTo(row.querySelector(".s8-bar"), { scaleX: 0 }, { scaleX: 1, duration: durs[i], ease: i === 3 ? "power4.in" : "power3.out" }, starts[i]);
            tl.fromTo(row.querySelector(".s8-val"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, starts[i] + (i === 3 ? 0.5 : 0.15));
            tl.to(p, { v: vals[i], duration: durs[i], ease: i === 3 ? "power4.in" : "power3.out", onUpdate: () => (out.textContent = inr(p.v)) }, starts[i]);
          });
          const hit = 8 * B;
          tl.fromTo(".s8-spark", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo("#s8-rowd", { x: 0 }, { x: 16, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, hit);
          tl.fromTo("#s8-rowd .s8-val", { scale: 1 }, { scale: 1.3, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, hit);
          gsap.utils.toArray(".s8-spark").forEach((el, i) => {
            const a = (i / 8) * Math.PI * 2 + 0.3;
            tl.fromTo(el, { x: 0, y: 0, rotation: (a * 180) / Math.PI + 90, scaleY: 1, opacity: 1 }, { x: Math.cos(a) * 230, y: Math.sin(a) * 150, scaleY: 0.2, opacity: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, hit);
          });
          const d = { v: 0 };
          const dn = document.getElementById("s8-dnum");
          tl.fromTo("#s8-delta", { scale: 0, rotation: 18 }, { scale: 1, rotation: 4, duration: 0.6, ease: "elastic.out(1, 0.55)" }, hit + 0.1);
          tl.to(d, { v: 42773, duration: 0.9, ease: "power3.out", onUpdate: () => (dn.textContent = inr(d.v)) }, hit + 0.1);
          gsap.utils.toArray(".s8-chip").forEach((el, i) => {
            tl.fromTo(el, { scale: 0, rotation: i % 2 ? 10 : -10 }, { scale: 1, rotation: i % 2 ? 1.5 : -1.5, duration: 0.4, ease: "back.out(2.2)" }, (10 + i) * B);
          });
          tl.fromTo("#s8-honest", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.inOut" }, 13 * B);
          tl.fromTo("#s8-delta", { rotation: 4 }, { rotation: 1, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 13 * B);
          window.__timelines["s8-arena"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
