<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #rail-root {
          position: absolute;
          inset: 0;
        }
        #rail-line {
          position: absolute;
          left: 90px;
          top: 1036px;
          width: 1740px;
          height: 4px;
          border-radius: 2px;
          background: var(--ink);
          transform-origin: 0 50%;
        }
        #rail-fill {
          position: absolute;
          left: 90px;
          top: 1033px;
          width: 1740px;
          height: 10px;
          border-radius: 5px;
          background: var(--terra);
          border: 3px solid var(--ink);
          transform-origin: 0 50%;
        }
        .rail-tick {
          position: absolute;
          top: 1046px;
          width: 84px;
          margin-left: -42px;
          text-align: center;
          font-family: var(--mono);
          font-weight: 700;
          font-size: 20px;
          color: var(--ink);
          background: var(--paper);
          border-radius: 8px;
          line-height: 26px;
        }
        #rail-cup {
          position: absolute;
          left: 62px;
          top: 1000px;
          width: 56px;
          height: 56px;
        }
      </style>
      <div id="rail-root" data-composition-id="rail" data-width="1920" data-height="1080">
        <div id="rail-line"></div>
        <div id="rail-fill"></div>
        <div class="rail-tick" style="left: 90px">07:00</div>
        <div class="rail-tick" style="left: 554px">11:00</div>
        <div class="rail-tick" style="left: 1018px">15:00</div>
        <div class="rail-tick" style="left: 1482px">19:00</div>
        <div class="rail-tick" style="left: 1830px">22:00</div>
        <svg id="rail-cup" viewBox="0 0 56 56">
          <path d="M10 20 h30 v14 a12 12 0 0 1 -12 12 h-6 a12 12 0 0 1 -12 -12 z" fill="#fbf7f1" stroke="#1d1a1c" stroke-width="4" stroke-linejoin="round" />
          <path d="M40 24 h4 a6 6 0 0 1 0 12 h-4" fill="none" stroke="#1d1a1c" stroke-width="4" />
          <path d="M18 14 q-4 -5 0 -9 M28 14 q-4 -5 0 -9" fill="none" stroke="#a3452f" stroke-width="3.5" stroke-linecap="round" />
        </svg>
      </div>
      <script>
        (() => {
          // the café's day under the tour (07:00 -> 22:00 over 1740 px): the cup jumps to each scene's hour on its
          // first hit and hops on every hit after
          const { t, hits } = BREW;
          const S = t(8), END = t(56);
          const at = (e) => t(e) - S;
          const x = (h) => ((h - 7) / 15) * 1740;
          const day = [[8, 8.13], [24, 8.5], [40, 9], [48, 13.5]];
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#rail-root", { y: 90 }, { y: 0, duration: 0.2, ease: "power3.out" }, 0);
          tl.fromTo("#rail-cup", { x: 0 }, { x: x(8.13), duration: 0.3, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo("#rail-fill", { scaleX: 0 }, { scaleX: x(8.13) / 1740, duration: 0.3, ease: "power3.out" }, 0.05);
          day.slice(1).forEach(([e, h], i) => {
            const prev = day[i][1];
            tl.fromTo("#rail-cup", { x: x(prev) }, { x: x(h), duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, at(e));
            tl.fromTo("#rail-fill", { scaleX: x(prev) / 1740 }, { scaleX: x(h) / 1740, duration: 0.3, ease: "power3.out", immediateRender: false }, at(e));
          });
          hits(S, END, 0.5).forEach((h) => {
            tl.fromTo("#rail-cup", { y: -16 * h.s, rotation: h.e % 2 ? 9 : -9 }, { y: 0, rotation: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, h.t);
          });
          tl.fromTo("#rail-root", { y: 0 }, { y: 90, duration: 0.16, ease: "power3.in", immediateRender: false }, END - S - 0.18);
          window.__timelines["rail"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
