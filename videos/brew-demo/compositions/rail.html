<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #rail-root {
          position: absolute;
          inset: 0;
        }
        #rail-line {
          position: absolute;
          left: 90px;
          top: 1036px;
          width: 1740px;
          height: 4px;
          border-radius: 2px;
          background: var(--ink);
          transform-origin: 0 50%;
        }
        #rail-fill {
          position: absolute;
          left: 90px;
          top: 1033px;
          width: 1740px;
          height: 10px;
          border-radius: 5px;
          background: var(--terra);
          border: 3px solid var(--ink);
          transform-origin: 0 50%;
        }
        .rail-tick {
          position: absolute;
          top: 1046px;
          width: 84px;
          margin-left: -42px;
          text-align: center;
          font-family: var(--mono);
          font-weight: 700;
          font-size: 20px;
          color: var(--ink);
          background: var(--paper);
          border-radius: 8px;
          line-height: 26px;
        }
        #rail-cup {
          position: absolute;
          left: 62px;
          top: 1000px;
          width: 56px;
          height: 56px;
        }
      </style>
      <div id="rail-root" data-composition-id="rail" data-width="1920" data-height="1080">
        <div id="rail-line"></div>
        <div id="rail-fill"></div>
        <div class="rail-tick" style="left: 90px">07:00</div>
        <div class="rail-tick" style="left: 554px">11:00</div>
        <div class="rail-tick" style="left: 1018px">15:00</div>
        <div class="rail-tick" style="left: 1482px">19:00</div>
        <div class="rail-tick" style="left: 1830px">22:00</div>
        <svg id="rail-cup" viewBox="0 0 56 56">
          <path d="M10 20 h30 v14 a12 12 0 0 1 -12 12 h-6 a12 12 0 0 1 -12 -12 z" fill="#fbf7f1" stroke="#1d1a1c" stroke-width="4" stroke-linejoin="round" />
          <path d="M40 24 h4 a6 6 0 0 1 0 12 h-4" fill="none" stroke="#1d1a1c" stroke-width="4" />
          <path d="M18 14 q-4 -5 0 -9 M28 14 q-4 -5 0 -9" fill="none" stroke="#a3452f" stroke-width="3.5" stroke-linecap="round" />
        </svg>
      </div>
      <script>
        (() => {
          // where each scene sits in the café's day (07:00 -> 22:00 over 1740 px); times are local to this clip,
          // which starts on bar 2 of the film
          const BAR = 8 / 3;
          const at = (h) => ((h - 7) / 15) * 1740;
          const day = [
            [0, 8.13], // the morning rush
            [3 * BAR, 8.3],
            [5 * BAR, 8.5], // the espresso machine
            [8 * BAR, 9], // the menu book
            [10 * BAR, 13.5], // the pantry
            [12 * BAR, 17], // kapi
            [15 * BAR, 20.5], // the arena
          ];
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#rail-line", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.2);
          tl.fromTo(".rail-tick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.07, ease: "power2.out" }, 0.4);
          tl.fromTo("#rail-cup", { opacity: 0, x: 0 }, { opacity: 1, x: at(8.13), duration: 0.7, ease: "back.out(1.4)" }, 0.5);
          tl.fromTo("#rail-fill", { scaleX: 0 }, { scaleX: at(8.13) / 1740, duration: 0.7, ease: "power2.out" }, 0.5);
          day.slice(1).forEach(([T, h], i) => {
            const prev = day[i][1];
            tl.fromTo("#rail-cup", { x: at(prev) }, { x: at(h), duration: 0.8, ease: "power3.inOut", immediateRender: false }, T + 0.15);
            tl.fromTo("#rail-fill", { scaleX: at(prev) / 1740 }, { scaleX: at(h) / 1740, duration: 0.8, ease: "power3.inOut", immediateRender: false }, T + 0.15);
          });
          // the cup bobs on the beat while it waits
          tl.fromTo("#rail-cup", { y: 0 }, { y: -7, duration: 1 / 3, ease: "sine.inOut", yoyo: true, repeat: 147, immediateRender: false }, 1.3);
          window.__timelines["rail"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
