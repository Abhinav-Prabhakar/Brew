[project]
name = "brew"
version = "0.1.0"
description = "Brew: digital-twin cafe simulator, policies and FastAPI service"
readme = "docs/backend-quickstart.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
brew-api = "brew.cli:api_main"
brew-sim = "brew.cli:sim_main"
brew-train = "brew.cli:train_main"
brew-eval = "brew.cli:eval_main"
brew-synth = "brew.cli:synth_main"
brew-seed = "brew.cli:seed_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brew"]

[tool.pytest.ini_options]
markers = ["slow: training / long-running tests", "property: Hypothesis invariants", "integration: API / WS / DB tests"]
addopts = "-q -m 'not slow' --timeout=180"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using .httpx. with"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["lobby", ".claude", "*.md", "plan.md", "technical.md", "backend.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "RUF005", "SIM108", "SIM102", "SIM109", "B905", "B007", "RUF001", "RUF002", "RUF003", "RUF028", "RUF059", "RUF007", "SIM105", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B011", "SIM117"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["brew.sim.*", "brew.events.*", "brew.api.*", "brew.policies.*"]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src/brew"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
]
