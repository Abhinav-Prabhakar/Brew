<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brew Café Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Two hand-inked rooms side by side on one 3200px track; the shared HUD floats above and the track slides between them. */
  :root{
    --ink:#1d1a1c; --paper:#fbf7f1; --ground:#efe6dc;
    --pink:#f7c3a3; --pink-d:#e07e52; --pink-l:#fdeee4;
    --sage:#8fa585; --olive:#6f7a4c; --terra:#c0634f; --mustard:#e3b25a; --navy:#3d4556; --kraft:#c9a27a;
    --steel:#e4e7eb; --steel-l:#f2f4f6; --ok:#7fc37a; --warn:#f2b33d; --bad:#e2483d;
    --hand:'Gochi Hand','Comic Sans MS',cursive; --body:'Patrick Hand','Comic Sans MS',cursive;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{background:var(--ground)}
  body{background:var(--ground);font-family:var(--body);color:var(--ink);padding-inline:16px;padding-block:12px 24px;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #frame{position:relative;overflow:hidden;max-width:1600px;margin-inline:auto}
  #wrap{width:1600px;height:1000px;transform-origin:top left}
  #viewport{position:relative;width:1600px;height:1000px;overflow:hidden;background:var(--paper)}
  #track{position:absolute;top:0;left:0;width:4800px;height:1000px;transition:transform 1.1s cubic-bezier(.7,0,.22,1);will-change:transform}
  body[data-room="kitchen"] #track{transform:translateX(-1600px)}
  body[data-room="pantry"] #track{transform:translateX(-3200px)}
  .room{position:absolute;top:0;width:1600px;height:1000px;overflow:hidden}
  #lobby{left:0} #kitchen{left:1600px} #pantry{left:3200px}
  .room > svg{position:absolute;inset:0;width:1600px;height:1000px}
  #hud{position:absolute;inset:0;pointer-events:none}
  #hud > *{pointer-events:auto}

  /* ---- shared hand-drawn pieces ---- */
  .card{position:absolute;background:#fffdf9;border:3px solid var(--ink);
    border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:4px 5px 0 var(--ink);padding:8px 16px}
  .chip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:15px;line-height:22px;background:var(--pink-l);white-space:nowrap}
  .chip.dark{background:var(--ink);color:#fff;font-size:13px;line-height:19px}
  .btn{font-family:var(--hand);font-size:18px;background:var(--pink);border:2.5px solid var(--ink);border-radius:12px;padding:3px 12px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  :focus-visible{outline:3px solid var(--pink-d);outline-offset:3px}

  /* ---- HUD ---- */
  .logo{left:18px;top:12px;padding:4px 20px 6px}
  .logo .word{font-family:var(--hand);font-size:46px;line-height:46px;color:var(--pink-d);text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
  .logo .sub{font-size:15px;margin-top:-2px;opacity:.75}
  .clock{left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 18px}
  .clock .time{font-family:var(--hand);font-size:30px;line-height:30px;font-variant-numeric:tabular-nums}
  .clock .time{min-width:190px}
  .live{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:0 10px 0 8px;font-size:15px;line-height:24px;background:#fff;white-space:nowrap}
  .live i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 2s ease-in-out infinite}
  .live[data-status="lagging"] i,.live[data-status="connecting"] i{background:var(--warn);box-shadow:0 0 6px var(--warn)}
  .live[data-status="offline-demo"] i,.live[data-status="offline"] i{background:var(--bad);box-shadow:0 0 6px var(--bad);animation:blink 1.2s steps(2) infinite}
  .live[data-status="replay"] i{background:var(--pink-d);box-shadow:none}
  @keyframes pulse{50%{opacity:.45}}
  .money{right:18px;top:12px;display:flex;gap:16px;align-items:center;padding:8px 18px}
  .money .lbl{font-size:14px;opacity:.7;line-height:14px}
  .money .amt{font-family:var(--hand);font-size:34px;line-height:34px}
  .money .up{font-size:14px;background:#e4efd9}
  .money .stars{font-size:16px;line-height:20px}
  .money .stars span{color:var(--mustard);-webkit-text-stroke:1px var(--ink)}
  .money{cursor:pointer;transition:transform .25s ease}
  .money:hover{transform:translateY(-2px) rotate(-.4deg)}
  .money .amt{font-variant-numeric:tabular-nums;min-width:150px}
  .money .amt.neg{color:var(--terra)}
  .money .up.down{background:#fbe1d9}
  .bgm{display:flex;align-items:center;gap:2px;font-size:13px;opacity:.7}
  .cmp{right:18px;top:96px;width:560px;padding:10px 18px 12px;z-index:30;transform-origin:85% 0;animation:drop .45s cubic-bezier(.2,.9,.3,1.15)}
  .cmp[hidden]{display:none}
  @keyframes drop{from{transform:translateY(-14px) scaleY(.6);opacity:0}to{transform:none;opacity:1}}
  .cmp h3{font-family:var(--hand);font-weight:400;font-size:24px;line-height:26px;display:flex;align-items:baseline;gap:8px}
  .cmp h3 small,.cmp .note{font-family:var(--body);font-size:13.5px;opacity:.65}
  .cmp .note{font-family:'Caveat',cursive;font-size:18px;opacity:.8;margin-top:2px}
  .cmp svg{display:block;margin-top:4px;overflow:visible}
  .toast{position:absolute;left:50%;top:104px;translate:-50% 0;z-index:60;font-family:var(--hand);font-size:20px;background:#fffdf9;border:3px solid var(--ink);border-radius:14px 18px 12px 16px;box-shadow:4px 5px 0 var(--ink);padding:4px 16px;animation:toastIn 3.2s ease forwards;pointer-events:none}
  .toast.bad{background:#fbe1d9;color:var(--terra)}
  @keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
  .btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;box-shadow:1px 1px 0 var(--ink)}
  .btn:not([disabled]):not([aria-disabled="true"]):hover{transform:translateY(-1px)}
  .btn:not([disabled]):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

  .tabs{position:absolute;left:690px;top:950px;display:flex;gap:9px}
  .tab{font-family:var(--hand);font-size:18px;padding:3px 9px;background:#fffdf9;border:2.5px solid var(--ink);
     border-radius:12px 14px 10px 13px;box-shadow:3px 3px 0 var(--ink);transition:transform .25s ease, background-color .25s ease}
  .tab:hover{transform:translateY(-2px)}
  .tab.on{background:var(--pink-d);color:#fff;text-shadow:1px 1px 0 var(--ink);transform:translateY(-4px) rotate(-2deg)}
  .tab.nope{animation:nope .45s ease}
  @keyframes nope{20%{transform:translateX(-4px) rotate(-3deg)}45%{transform:translateX(4px) rotate(3deg)}70%{transform:translateX(-2px)}}


  /* ---- lobby overlays ---- */
  .rl{left:236px;top:814px;width:340px;background:var(--pink-l);transform:rotate(-1.6deg);border-radius:6px 14px 8px 12px;padding:12px 16px}
  .rl::before{content:'';position:absolute;left:120px;top:-14px;width:90px;height:24px;background:rgba(227,178,90,.55);border:1.5px dashed rgba(29,26,28,.4);transform:rotate(3deg)}
  .rl h3{font-family:var(--hand);font-weight:400;font-size:22px;line-height:24px;display:flex;align-items:center;gap:8px}
  .rl h3 .chip{background:var(--ink);color:#fff;font-size:13px;line-height:18px}
  .rl ul{list-style:none;margin-top:6px;font-size:15.5px;line-height:21px}
  .rl li::before{content:'→ ';color:var(--pink-d);font-weight:700}
  .kds{position:absolute;left:604px;top:810px;width:420px;background:#2f3a33;border:6px solid #b07f55;outline:3px solid var(--ink);
     border-radius:8px;box-shadow:4px 5px 0 var(--ink);padding:6px 14px 8px;color:#f6f1e6;font-family:'Caveat',cursive;font-weight:600}
  .kds h4{font-size:22px;line-height:22px;font-weight:700;display:flex;justify-content:space-between}
  .kds h4 small{font-size:17px;opacity:.7}
  .kds .row{display:grid;grid-template-columns:1fr 110px 36px;align-items:center;font-size:19px;line-height:21px;gap:8px}
  .kds .bar{height:9px;border:1.5px solid #f6f1e6;border-radius:5px;position:relative;overflow:hidden}
  .kds .bar i{position:absolute;inset:0 auto 0 0;background:var(--pink);transition:width .8s ease}
  .kds .row > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kds .more{font-size:16px;opacity:.7;line-height:18px}
  .rl li small{font-family:var(--body);font-size:12px;opacity:.55}
  .rl li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- lobby motion (SVG) ---- */
  #lobby-scene .who .leg{transform-box:fill-box;transform-origin:50% 0}
  #lobby-scene .who.walking .leg-l{animation:kLeg .42s ease-in-out infinite alternate}
  #lobby-scene .who.walking .leg-r{animation:kLeg .42s ease-in-out infinite alternate-reverse}
  #lobby-scene .who.walking .bob{animation:bob .42s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-4px)}}
  #lobby-scene .tk.torn{clip-path:inset(4px 0 0 0)}
  .l-print{animation:print 1.2s steps(12) both}
  @keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
  .l-bell{transform-box:fill-box;transform-origin:50% 100%}
  .l-bell.ring{animation:kBell 1.2s ease-in-out}
  .l-ding{opacity:0}
  .l-ding.ring{animation:ding 1.2s ease-out}
  @keyframes ding{10%,60%{opacity:1}100%{opacity:0}}
  .l-rainy{animation:rain .55s linear infinite}
  @keyframes rain{from{transform:translate(0,-30px)}to{transform:translate(-8px,30px)}}
  .l-blink{animation:blink 1.4s steps(2) infinite}
  .bn{left:1058px;top:808px;width:516px;padding:8px 16px 10px}
  .bn h3, .crew h3, .chaos h3, .pfresh h3, .porder h3{font-family:var(--hand);font-weight:400;font-size:23px;line-height:26px;display:flex;align-items:center;gap:8px}
  .bn h3 small, .crew h3 small, .pfresh h3 small{font-family:var(--body);font-size:14px;opacity:.65}
  .bn .r{display:grid;grid-template-columns:150px 1fr 112px;gap:10px;align-items:center;font-size:15px;line-height:21px}
  .bar2{height:11px;border:2px solid var(--ink);border-radius:6px;position:relative;overflow:hidden;background:#fff}
  .bar2 i{position:absolute;inset:0 auto 0 0;transition:width .6s ease, background-color .6s ease}
  .hot{color:var(--terra);font-weight:700}
  .good{color:#4f7a45;font-weight:700}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;border-top:2px dashed rgba(29,26,28,.35);padding-top:6px;font-size:15px;line-height:18px}

  /* ---- kitchen overlays ---- */
  .crew{left:24px;top:808px;width:556px;padding:8px 16px 10px}
  .crow{display:grid;grid-template-columns:28px 52px 118px 1fr 140px;gap:10px;align-items:center;font-size:15px;line-height:23px}
  .crow .face{width:26px;height:26px}
  .crow .stn{display:flex;align-items:center;gap:5px;font-size:14.5px}
  .crow .stn svg{width:22px;height:22px;flex:none}
  .tag{justify-self:start;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;line-height:20px;border:2px solid var(--ink);border-radius:999px;padding:0 9px;background:#e4efd9;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tag.warn{background:#fbeec6} .tag.rest{background:var(--pink-l)}
  .tag svg{width:15px;height:15px}
  .crew .rule{margin-top:2px;font-size:12.5px;opacity:.75;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  .crew .rule svg{width:17px;height:17px}

  .board{position:absolute;left:604px;top:808px;width:420px;background:var(--steel);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 5px 0 var(--ink);padding:5px 10px 8px}
  .board .bh{display:flex;justify-content:space-between;align-items:center;font-family:var(--hand);font-size:19px;line-height:22px}
  .board .bh small{font-family:var(--body);font-size:13px;display:flex;gap:6px;align-items:center;opacity:.85}
  .board .cells{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:3px}
  .cell{display:flex;flex-direction:column;align-items:center;background:var(--steel-l);border:2px solid var(--ink);border-radius:8px;padding:2px 0 3px;font-size:12.5px;line-height:14px;font-variant-numeric:tabular-nums}
  .cell svg{width:26px;height:26px}
  .cell span{display:flex;align-items:center;gap:3px}
  .led{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
  .led.g{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .led.a{background:var(--warn);box-shadow:0 0 6px var(--warn)}
  .led.r{background:var(--bad);box-shadow:0 0 7px var(--bad);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}

  .chaos{left:1058px;top:808px;width:516px;padding:8px 16px 10px}
  .chaos h3 svg{width:24px;height:24px}
  .cr{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;font-size:15px;line-height:22px}
  .cr svg{width:22px;height:22px}
  .cr b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cr.calm span{font-family:'Caveat',cursive;font-size:19px;opacity:.75}
  .cbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:5px}
  .cbtn{display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;line-height:13px;padding:2px 2px 3px;background:#fff;border:2.5px solid var(--ink);border-radius:12px 14px 10px 13px;box-shadow:2px 3px 0 var(--ink);transition:transform .15s ease, background-color .2s ease}
  .cbtn svg{width:21px;height:21px}
  .cbtn:hover:not([disabled]){background:#fbeec6;transform:translateY(-2px) rotate(-1.5deg)}
  .cbtn:active:not([disabled]){transform:translate(2px,2px);box-shadow:0 1px 0 var(--ink)}
  .cbtn[disabled]{opacity:.45;cursor:not-allowed}
  .chaos .foot{margin-top:5px;padding-top:4px}
  .chaos .cr{line-height:21px}
  .crow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- kitchen motion (SVG) ---- */
  .k-steam{animation:kSteam 2.6s ease-out infinite}
  @keyframes kSteam{0%{transform:translateY(6px);opacity:0}35%{opacity:.6}100%{transform:translateY(-18px);opacity:0}}
  .k-pour{animation:kDash .5s linear infinite}
  .k-route{animation:kDash .8s linear infinite}
  .k-water{animation:kDash .4s linear infinite}
  .k-swirl{animation:kDash .35s linear infinite}
  @keyframes kDash{to{stroke-dashoffset:-22}}
  .k-glow{animation:kGlow 3s ease-in-out infinite}
  @keyframes kGlow{0%,100%{opacity:.08}50%{opacity:.34}}
  .k-rise{transform-box:fill-box;transform-origin:50% 100%;animation:kRise 4s ease-in-out infinite}
  @keyframes kRise{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1.06)}}
  .k-bub{transform-box:fill-box;transform-origin:center;animation:kBub 1.1s ease-out infinite}
  @keyframes kBub{0%{transform:translateY(2px) scale(.3);opacity:0}40%{opacity:1}100%{transform:translateY(-6px) scale(1.15);opacity:0}}
  .k-spark{transform-box:fill-box;transform-origin:center;animation:kSpark .9s steps(6) infinite}
  @keyframes kSpark{0%,100%{transform:scale(.6) rotate(0);opacity:.3}20%{transform:scale(1.25) rotate(20deg);opacity:1}40%{transform:scale(.8) rotate(-10deg);opacity:.9}60%{opacity:.2}}
  .k-fly{animation:kFly .8s ease-out infinite}
  @keyframes kFly{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
  .k-smoke{transform-box:fill-box;transform-origin:center;animation:kSmoke 3s ease-out infinite}
  @keyframes kSmoke{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:.5}100%{transform:translate(10px,-46px) scale(1.5);opacity:0}}
  .k-drip{animation:kDrip 1.6s ease-in infinite}
  @keyframes kDrip{0%{transform:translateY(0);opacity:0}20%{opacity:1}90%{transform:translateY(9px);opacity:1}100%{transform:translateY(10px);opacity:0}}
  .k-whoosh{animation:kWhoosh 2.2s ease-in-out infinite}
  @keyframes kWhoosh{0%,100%{opacity:0}40%,60%{opacity:.8}}
  .k-chop{transform-box:fill-box;transform-origin:100% 50%;animation:kChop .7s ease-in-out infinite}
  @keyframes kChop{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(16deg)}}
  .k-z{animation:kZ 2.8s ease-out infinite}
  @keyframes kZ{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(14px,-26px);opacity:0}}
  .k-bell{transform-box:fill-box;transform-origin:50% 100%;animation:kBell 4s ease-in-out infinite}
  @keyframes kBell{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}85%{transform:rotate(-6deg)}90%{transform:rotate(3deg)}}
  .k-ding{animation:kDing 4s ease-in-out infinite}
  @keyframes kDing{0%,72%{opacity:0}78%,92%{opacity:1}100%{opacity:0}}
  .k-slide{animation:kSlide 5s cubic-bezier(.5,0,.3,1) infinite}
  @keyframes kSlide{0%{transform:translateX(120px);opacity:0}12%{opacity:1}80%{transform:translateX(-110px);opacity:1}100%{transform:translateX(-130px);opacity:0}}
  .k-sign{transform-box:fill-box;transform-origin:50% 100%;animation:kSign 3s ease-in-out infinite}
  @keyframes kSign{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .k-turn{transform-box:fill-box;transform-origin:center;animation:kTurn 1s linear infinite}
  @keyframes kTurn{to{transform:rotate(360deg)}}
  .k-door{transform-box:fill-box;transform-origin:0 50%}
  .k-door.swing{animation:kSwing 1.2s ease-out}
  @keyframes kSwing{0%{transform:scaleX(1)}25%{transform:scaleX(.3)}50%{transform:scaleX(.9)}70%{transform:scaleX(.62)}85%{transform:scaleX(.95)}100%{transform:scaleX(1)}}
  .staff .leg{transform-box:fill-box;transform-origin:50% 0}
  .staff.walking .leg-l{animation:kLeg .42s ease-in-out infinite alternate}
  .staff.walking .leg-r{animation:kLeg .42s ease-in-out infinite alternate-reverse}
  @keyframes kLeg{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
  .staff .arms-walk{display:none}
  .staff.walking .arms-walk{display:inline}
  .staff.walking .arms-work{display:none}
  .staff:not(.walking) .arms-work{animation:kWork .45s ease-in-out infinite alternate}
  @keyframes kWork{to{transform:translateY(-4px)}}

  /* ---- pantry ---- */
  .p-hit{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer;transition:fill .2s ease, stroke .2s ease}
  .p-hit:hover,.p-hit.on,.p-hit:focus{stroke:var(--pink-d);stroke-dasharray:7 5;fill:rgba(247,195,163,.16);outline:none}
  .art{overflow:visible;flex:none}
  #p-tip{position:absolute;width:336px;background:#fffdf9;border:3px solid var(--ink);border-radius:14px 18px 12px 16px;box-shadow:5px 6px 0 var(--ink);
    padding:10px 12px;pointer-events:none;transition:left .25s ease, top .25s ease;z-index:5}
  #p-tip .th{display:grid;grid-template-columns:50px 1fr auto;gap:8px;align-items:center}
  #p-tip .tn{min-width:0}
  #p-tip .tn b{font-family:var(--hand);font-weight:400;font-size:22px;line-height:22px;display:block}
  .sup{display:inline-flex;align-items:center;gap:4px;font-size:13px;opacity:.75;white-space:nowrap}
  .onhand{font-family:var(--hand);font-size:19px;background:var(--pink-l);border:2px solid var(--ink);border-radius:10px;padding:0 8px;white-space:nowrap}
  .lots{margin-top:7px;display:grid;gap:4px}
  .lot{display:grid;grid-template-columns:70px 1fr 34px 50px;gap:6px;align-items:center;font-size:13px;line-height:18px;font-variant-numeric:tabular-nums}
  .lot .lq{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lot .fefo{color:var(--terra);margin-right:2px}
  .lot.first .lq{font-weight:700}
  .tl{display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center}
  .tl small{font-size:10.5px;opacity:.6;white-space:nowrap}
  .tb{position:relative;height:9px;border:1.8px solid var(--ink);border-radius:5px;background:#fff}
  .tb i{position:absolute;inset:0 auto 0 0;border-radius:3px}
  .tb em{position:absolute;top:-5px;width:3px;height:15px;background:var(--ink);transform:translateX(-50%);border-radius:2px}
  .dl{font-size:12px;text-align:center;border:1.8px solid var(--ink);border-radius:8px;line-height:16px}
  .op{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;white-space:nowrap}
  .op.sealed{opacity:.55}

<script>
(() => {
  const body = document.body, track = document.getElementById('track');
  const tabs = document.querySelectorAll('.tab[data-go]');
  const ROOMS = ['lobby', 'kitchen', 'pantry'], DOORS = {kitchen: 'k-door', pantry: 'p-door'};
  function go(room, instant){
    if (!ROOMS.includes(room)) room = 'lobby';
    if (instant) track.style.transition = 'none';
    body.dataset.room = room;
    tabs.forEach(t => t.classList.toggle('on', t.dataset.go === room));
    if (instant) { void track.offsetWidth; track.style.transition = ''; }
    else if (DOORS[room]) {
      const door = document.getElementById(DOORS[room]);
      setTimeout(() => { if (!door) return; door.classList.remove('swing'); void door.getBoundingClientRect(); door.classList.add('swing'); }, 650);
    }
    try { history.replaceState(null, '', room === 'lobby' ? location.pathname + location.search : '#' + room); } catch (e) {}
  }
  document.addEventListener('click', e => {
    const to = e.target.closest('[data-go]');
    if (to) return go(to.dataset.go);
  });
  addEventListener('keydown', e => {
    const i = ROOMS.indexOf(body.dataset.room);
    if (e.key === 'ArrowRight') go(ROOMS[Math.min(ROOMS.length - 1, i + 1)]);
    if (e.key === 'ArrowLeft') go(ROOMS[Math.max(0, i - 1)]);
  });
  go(location.hash.slice(1) || 'lobby', true);

  const frame = document.getElementById('frame');
  const fit = () => {
    const s = Math.min(1, frame.parentElement.clientWidth / 1600);
    document.getElementById('wrap').style.transform = `scale(${s})`;
    frame.style.height = (1000 * s) + 'px';
  };
  addEventListener('resize', fit); fit();
})();
</script>
